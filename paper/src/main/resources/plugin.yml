name: MCQQBridge
version: '1.0.0'
main: com.mcqq.bridge.paper.MCQQBridgePlugin
api-version: '1.21'
author: Cookie222333
description: Minecraft Paper 与 QQ 官方机器人双向消息互通插件
website: https://github.com/Cookie222333/mcqqbridge

commands:
  mcqq:
    description: MCQQBridge 管理命令
    usage: /mcqq <status|reload|help>
    permission: mcqqbridge.admin

permissions:
  mcqqbridge.admin:
    description: 允许使用 /mcqq 管理命令
    default: op
